name: Lighthouse

# Το δωρεάν όριο της Google είναι 30 έλεγχοι το λεπτό, δηλαδή περίπου 10.000
# σε ένα job των 6 ωρών. Το schedule τρέχει τις δόσεις μέχρι να ελεγχθούν όλα
# τα sites και μετά αφαιρείται· από εκεί και πέρα τρέχει μόνο όταν το ζητήσουμε.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Πόσα sites το πολύ (24000 = μία ημέρα)"
        required: false
        default: "24000"
      recheck_days:
        description: "Ξαναελέγχει sites που ελέγχθηκαν πριν από τόσες μέρες"
        required: false
        default: "90"
      report:
        description: "Μόνο σύνοψη των αποτελεσμάτων, χωρίς έλεγχο"
        type: boolean
        default: false

concurrency: lighthouse

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Lighthouse
        run: >
          uv run python pipeline/lighthouse.py
          --limit ${{ inputs.limit || 24000 }}
          --recheck-days ${{ inputs.recheck_days || 90 }}
          --max-minutes 340
          ${{ inputs.report && '--report' || '' }}
