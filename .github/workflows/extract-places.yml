name: Extract Overture places

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Overture release (κενό = το τελευταίο)"
        required: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Extract places
        run: uv run python pipeline/extract_places.py ${{ inputs.release && format('--release {0}', inputs.release) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: places-gr
          path: data/raw/*.parquet
          retention-days: 14
