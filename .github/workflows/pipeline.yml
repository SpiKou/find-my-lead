name: Data pipeline

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Overture release (κενό = το τελευταίο)"
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

      - name: Resolve Overture release
        id: release
        run: |
          if [ -n "${{ inputs.release }}" ]; then
            echo "value=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(curl -s https://stac.overturemaps.org/catalog.json | jq -r .latest)" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract places
        run: uv run python pipeline/extract_places.py --release ${{ steps.release.outputs.value }}

      - name: Extract divisions
        run: uv run python pipeline/extract_divisions.py --release ${{ steps.release.outputs.value }}

      - name: Assign region, municipality and locality
        run: uv run python pipeline/assign_admin.py --release ${{ steps.release.outputs.value }}

      - name: Normalize, dedupe and group into businesses
        run: uv run python pipeline/build_businesses.py --release ${{ steps.release.outputs.value }}

      - name: Load into database
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python pipeline/load_db.py --release ${{ steps.release.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: businesses-${{ steps.release.outputs.value }}
          path: |
            data/staging/locations_*.parquet
            data/staging/businesses_*.parquet
          retention-days: 14
