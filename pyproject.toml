[project]
name = "find-my-lead"
version = "0.1.0"
description = "Pipeline δεδομένων για τον κατάλογο ελληνικών επιχειρήσεων"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "phonenumbers>=9.0.42",
    "psycopg[binary]>=3.3.6",
    "tldextract>=5.4.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
